<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Visor · ACA-UGT 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  :root {
    --blau-aca:  #2E6CB0;
    --blau-fosc: #1F4F86;
    --vermell:   #D71920;
    --ink:       #1A1A1A;
    --bg:        #2A2D36;
    --line:      rgba(255,255,255,.12);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    /* Disable text selection page-wide */
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  }
  /* Disable drag on everything */
  * { -webkit-user-drag: none; -khtml-user-drag: none; -moz-user-drag: none; -o-user-drag: none; user-drag: none; }

  header.bar {
    height: 52px;
    background: linear-gradient(135deg, var(--blau-aca), var(--blau-fosc));
    color: white;
    display: flex; align-items: center; gap: 16px;
    padding: 0 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    z-index: 10; position: relative;
  }
  .bar .brand {
    font-size: 13px; letter-spacing: .12em; text-transform: uppercase; opacity: .9; font-weight: 700;
  }
  .bar .sep { opacity: .4; }
  .bar .title { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar button {
    background: rgba(255,255,255,.12); color: white; border: 1px solid rgba(255,255,255,.25);
    padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .15s ease;
  }
  .bar button:hover { background: rgba(255,255,255,.22); }
  .bar .nav-btns { display: flex; gap: 6px; }

  .viewer-frame {
    width: 100%;
    height: calc(100vh - 52px);
    border: 0;
    display: block;
  }

  .err {
    color: #fff; text-align: center; padding: 60px 24px;
    font-size: 16px;
  }
  .err h2 { font-size: 22px; margin: 0 0 8px; }
  .err a { color: #FFB; }

  /* invisible overlay that catches right-click within the iframe area */
  .protect-overlay {
    position: absolute;
    inset: 52px 0 0 0;
    pointer-events: none; /* let clicks through unless we need them */
  }
</style>
</head>
<body>

<header class="bar">
  <span class="brand">ACA-UGT 2026</span>
  <span class="sep">·</span>
  <span class="title" id="docTitle">Carregant…</span>
  <div class="nav-btns">
    <button id="prevBtn" type="button" title="Anterior" aria-label="Anterior">←</button>
    <button id="nextBtn" type="button" title="Següent" aria-label="Següent">→</button>
    <button id="closeBtn" type="button" title="Tancar" aria-label="Tancar">Tancar ✕</button>
  </div>
</header>

<div id="frameWrap" style="position:relative; width:100%; height:calc(100vh - 52px); background:#3a3d46;">
  <embed id="frame" type="application/pdf" src="about:blank"
         style="width:100%; height:100%; border:0; display:block;"
         title="Visor del missatge del dia">
  <div id="fallback" style="display:none; color:#fff; text-align:center; padding:60px 24px; position:absolute; inset:0; background:#2A2D36;">
    <h2 style="margin:0 0 12px; font-size:22px;">No es pot mostrar el PDF aquí</h2>
    <p style="margin:0 0 20px; opacity:.85; max-width:560px; margin-left:auto; margin-right:auto;">
      El teu navegador no permet incrustar PDFs des d'arxius locals. Això NO passa quan la pàgina està
      penjada a un servidor web (Netlify, GitHub Pages, etc.).
    </p>
    <a id="directLink" href="#" target="_blank"
       style="display:inline-block; background:#D71920; color:#fff; padding:12px 28px; border-radius:999px;
              text-decoration:none; font-weight:700;">
      Obrir el PDF en una pestanya nova
    </a>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---- Campaign items (NO dates here — they're loaded dynamically
  //      from index.html so you only need to update dates in ONE place) ----
  const items = [
    { i: 0,  pdf: "pdfs/4ce14270.pdf",  title: "Frases de suport" },
    { i: 1,  pdf: "pdfs/c11861b8.pdf",  title: "Qui som" },
    { i: 2,  pdf: "pdfs/12e98350.pdf",  title: "L'equip · part 1" },
    { i: 3,  pdf: "pdfs/441f21da.pdf",  title: "L'equip · part 2" },
    { i: 4,  pdf: "pdfs/4c267df1.pdf",  title: "Què hem fet i estem fent" },
    { i: 5,  pdf: "pdfs/01c0a2a0.pdf",  title: "El programa electoral" },
    { i: 6,  pdf: "pdfs/11ee27ed.pdf",  title: "Eix 1 · Drets laborals" },
    { i: 7,  pdf: "pdfs/b6a2bb56.pdf",  title: "Eix 2 · Recuperació de drets" },
    { i: 8,  pdf: "pdfs/0ea299e5.pdf",  title: "Eix 3 · Conciliació real" },
    { i: 9,  pdf: "pdfs/cd99c942.pdf",  title: "Eix 4 · Carrera professional" },
    { i: 10, pdf: "pdfs/89241a22.pdf",  title: "Eix 5 · Presència territorial" },
    { i: 11, pdf: "pdfs/9ecf3e3e.pdf",  title: "Eix 6 · Fermesa i via judicial" },
    { i: 12, pdf: "pdfs/03b3eb0e.pdf",  title: "Eix 7 · Transparència i comunicació" },
  ];

  // ---- Preview mode? (URL ?preview=1 unlocks everything) ----
  const params = new URLSearchParams(location.search);
  const preview = params.has('preview');

  // Today at 00:00 local
  const today = new Date(); today.setHours(0, 0, 0, 0);

  // Load dates dynamically from index.html so they always match (single source of truth)
  async function syncDatesFromIndex() {
    try {
      const response = await fetch('index.html', { cache: 'no-store' });
      if (!response.ok) throw new Error('fetch failed');
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const rows = doc.querySelectorAll('.path-row[data-idx][data-date]');
      rows.forEach(row => {
        const idx = parseInt(row.dataset.idx, 10);
        const date = row.dataset.date;
        const h2 = row.querySelector('h2');
        if (items[idx]) {
          items[idx].date = date;
          if (h2) items[idx].title = h2.textContent.trim();
        }
      });
    } catch (e) {
      // Fail open — if we can't load dates, just allow access
      // (the index.html already gated visibility for the navigation flow)
      console.warn('No s\'han pogut carregar les dates de index.html:', e);
    }
  }

  // An item is "available" if preview mode, no date set, or its date <= today
  function isAvailable(item) {
    if (preview) return true;
    if (!item.date) return true;  // fail-open if date wasn't loaded
    const d = new Date(item.date + "T00:00:00");
    return d <= today;
  }

  // ---- Anti-copy / anti-context behaviour ----
  // (Friction, NOT real protection. We explain this to admins.)
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    // Block obvious save/print shortcuts (browser may still process some at OS level)
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'p' || k === 'u')) {
      e.preventDefault();
      return false;
    }
  });

  // ---- Get current day from URL ----
  let idx = parseInt(params.get('d'), 10);
  if (Number.isNaN(idx) || idx < 0 || idx >= items.length) {
    document.body.innerHTML =
      '<div class="err"><h2>Document no trobat</h2>' +
      '<p>Aquest enllaç no és vàlid. <a href="index.html">Torna al camí</a>.</p></div>';
    return;
  }

  // ---- Boot: load dates from index.html, then validate access ----
  syncDatesFromIndex().then(function () {
    // Block direct URL access to unpublished items (?d=N before its date)
    if (!isAvailable(items[idx])) {
      document.body.innerHTML =
        '<div class="err"><h2>Publicació no disponible encara</h2>' +
        '<p>Aquesta publicació encara no s\'ha publicat. <a href="index.html">Torna al camí</a>.</p></div>';
      return;
    }
    // All good — initial load
    load(idx);
  });

  // ---- Find next/prev AVAILABLE item (skipping unpublished ones) ----
  function findPrev(fromIdx) {
    for (let i = fromIdx - 1; i >= 0; i--) {
      if (isAvailable(items[i])) return i;
    }
    return -1;
  }
  function findNext(fromIdx) {
    for (let i = fromIdx + 1; i < items.length; i++) {
      if (isAvailable(items[i])) return i;
    }
    return -1;
  }

  // ---- Load the PDF (with toolbar/navpanes hidden in Chromium PDF viewer) ----
  function load(i) {
    idx = i;
    var item = items[idx];
    document.getElementById('docTitle').textContent = item.title;
    var pdfUrl = item.pdf + "#toolbar=0&navpanes=0&scrollbar=1";
    var embed = document.getElementById('frame');
    var fallback = document.getElementById('fallback');
    var directLink = document.getElementById('directLink');

    // Reset
    fallback.style.display = 'none';
    embed.style.display = 'block';
    embed.src = pdfUrl;
    directLink.href = item.pdf;

    // Detect file:// protocol — Chrome refuses to embed local PDFs in many cases.
    // Show fallback after a brief delay if the PDF doesn't actually render.
    if (location.protocol === 'file:') {
      setTimeout(function () {
        // If the embed has no rendered content (Chrome blocks local PDF embeds),
        // its offsetHeight content stays empty. We just show the fallback as a safety net.
        try {
          if (!embed.contentDocument && !embed.getSVGDocument && embed.type === 'application/pdf') {
            // We can't reliably detect failure, so for file:// we ALWAYS show the fallback option.
            fallback.style.display = 'flex';
            fallback.style.flexDirection = 'column';
            fallback.style.justifyContent = 'center';
          }
        } catch (e) {
          fallback.style.display = 'block';
        }
      }, 800);
    }

    document.title = item.title + " · ACA-UGT 2026";

    // Compute prev/next available (skipping unpublished items)
    var prevIdx = findPrev(idx);
    var nextIdx = findNext(idx);
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    prevBtn.disabled = (prevIdx === -1);
    nextBtn.disabled = (nextIdx === -1);
    prevBtn.style.opacity = (prevIdx === -1) ? 0.35 : 1;
    nextBtn.style.opacity = (nextIdx === -1) ? 0.35 : 1;
    prevBtn.style.cursor = (prevIdx === -1) ? 'not-allowed' : 'pointer';
    nextBtn.style.cursor = (nextIdx === -1) ? 'not-allowed' : 'pointer';

    var u = new URL(location.href);
    u.searchParams.set('d', idx);
    history.replaceState(null, "", u.toString());
  }

  // ---- Wire up buttons (only navigate to available items) ----
  document.getElementById('prevBtn').addEventListener('click', () => {
    var p = findPrev(idx);
    if (p !== -1) load(p);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    var n = findNext(idx);
    if (n !== -1) load(n);
  });
  document.getElementById('closeBtn').addEventListener('click', () => {
    // Try to close the tab (only works if opened via window.open)
    if (window.opener) window.close();
    else location.href = 'index.html';
  });

  // Keyboard navigation (same skip-logic as buttons)
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('closeBtn').click();
    if (e.key === 'ArrowLeft') {
      var p = findPrev(idx);
      if (p !== -1) load(p);
    }
    if (e.key === 'ArrowRight') {
      var n = findNext(idx);
      if (n !== -1) load(n);
    }
  });

})();
</script>

</body>
</html>
